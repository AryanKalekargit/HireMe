<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="hireme-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="hireme-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Squircle Background with Glow -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#hireme-grad)" stroke="rgba(255,255,255,0.3)" stroke-width="2" filter="url(#hireme-glow)" />
  
  <!-- Bold White 'H' Lettermark -->
  <rect x="23" y="24" width="15" height="52" rx="3" fill="#FFFFFF" />
  <rect x="62" y="24" width="15" height="52" rx="3" fill="#FFFFFF" />
  <rect x="36" y="43" width="28" height="14" rx="2" fill="#FFFFFF" />
  
  <!-- Cyan AI Sparkle with White Core -->
  <path d="M 78 9 Q 78 21 90 21 Q 78 21 78 33 Q 78 21 66 21 Q 78 21 78 9 Z" fill="#38BDF8" />
  <circle cx="78" cy="21" r="2.8" fill="#FFFFFF" />
</svg>
